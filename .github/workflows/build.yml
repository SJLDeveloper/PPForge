name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: pp_forge
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: pp_forge.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: pp_forge
          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: pp_forge
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --locked --target ${{ matrix.target }}
      - name: Clippy
        run: cargo clippy --locked --target ${{ matrix.target }} -- -D warnings
      - name: Build release
        run: cargo build --locked --release --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: pp_forge-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ matrix.artifact }}
